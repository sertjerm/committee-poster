modal-view"><button type="button" data-direction="previous" aria-label="ภาพก่อนหน้า">‹</button><img class="modal-image" src="" alt=""><button type="button" data-direction="next" aria-label="ภาพถัดไป">›</button></div></dialog><script>(() => { const cards = [...document.querySelectorAll('.media-card')]; const dialog = document.querySelector('.media-modal'); if (!cards.length || !dialog) return; const image = dialog.querySelector('.modal-image'), download = dialog.querySelector('.modal-download'), fullscreen = dialog.querySelector('.modal-fullscreen'); let current = 0, startX = 0; const show = index => { current = (index + cards.length) % cards.length; const card = cards[current]; image.src = card.dataset.src; image.alt = card.dataset.label; download.href = card.dataset.src; download.setAttribute('download', card.dataset.label); }; const open = index => { show(index); dialog.showModal(); }; const updateFullscreenLabel = () => fullscreen.setAttribute('aria-label', document.fullscreenElement === image ? 'ออกจากโหมดเต็มจอ' : 'ดูเต็มจอ'); cards.forEach((card, index) => card.addEventListener('click', () => open(index))); dialog.querySelector('[data-direction="previous"]').addEventListener('click', () => show(current - 1)); dialog.querySelector('[data-direction="next"]').addEventListener('click', () => show(current + 1)); dialog.querySelector('.modal-close').addEventListener('click', () => dialog.close()); fullscreen.addEventListener('click', async () => { if (document.fullscreenElement) return document.exitFullscreen?.(); const request = image.requestFullscreen || image.webkitRequestFullscreen; if (request) await request.call(image); }); document.addEventListener('fullscreenchange', updateFullscreenLabel); dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }); dialog.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') { event.preventDefault(); show(current - 1); } if (event.key === 'ArrowRight') { event.preventDefault(); show(current + 1); } }); dialog.addEventListener('touchstart', event => startX = event.changedTouches[0].screenX, { passive: true }); dialog.addEventListener('touchend', event => { const distance = event.changedTouches[0].screenX - startX; if (Math.abs(distance) > 40) show(current + (distance < 0 ? 1 : -1)); }, { passive: true }); })();</script><footer><span>ผู้สมัครกรรมการ สายวิชาการ · ประจำปี 2570</span><span>ข้อมูลเรียบเรียงจากประวัติและแนวคิดที่ผู้สมัครส่งมา</span></footer></body></html>

e'), download = dialog.querySelector('.modal-download'); let current = 0, startX = 0; const show = index => { current = (index + cards.length) % cards.length; const card = cards[current]; image.src = card.dataset.src; image.alt = card.dataset.label; download.href = card.dataset.src; download.setAttribute('download', card.dataset.label); }; const open = index => { show(index); dialog.showModal(); }; cards.forEach((card, index) => card.addEventListener('click', () => open(index))); dialog.querySelector('[data-direction="previous"]').addEventListener('click', () => show(current - 1)); dialog.querySelector('[data-direction="next"]').addEventListener('click', () => show(current + 1)); dialog.querySelector('.modal-close').addEventListener('click', () => dialog.close()); dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); }); dialog.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') { event.preventDefault(); show(current - 1); } if (event.key === 'ArrowRight') { event.preventDefault(); show(current + 1); } }); dialog.addEventListener('touchstart', event => startX = event.changedTouches[0].screenX, { passive: true }); dialog.addEventListener('touchend', event => { const distance = event.changedTouches[0].screenX - startX; if (Math.abs(distance) > 40) show(current + (distance < 0 ? 1 : -1)); }, { passive: true }); })();</script><footer><span>ผู้สมัครกรรมการ สายวิชาการ · ประจำปี 2570 · เปรียบเทียบ: <a href="v1/index.html" style="text-decoration:underline;">v1 (ตราเขียวทอง) ↗</a> | <a href="v2/index.html" style="text-decoration:underline;">v2 (ChatGPT) ↗</a></span><span>ข้อมูลเรียบเรียงจากประวัติและแนวคิดที่ผู้สมัครส่งมา</span></footer></body></html>
